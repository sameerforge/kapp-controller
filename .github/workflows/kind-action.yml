name: Kind Cluster E2E tests

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths-ignore:
    - 'docs/**'
    - '*.md'
    - 'cli/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kinder
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Carvel Tools
        run: ./hack/install-deps.sh
      # Run benchmark with `go test -bench` and stores the output to a file
      - name: Install kc and run e2e tests on kind
        run: |
          set -e -x
          kubectl version
          source ./hack/version-util.sh
          ytt -f config/config -f config/values-schema.yml -f config-dev -v dev.version="$(get_kappctrl_ver)+develop" | kbld -f- > kbld.out 2> kbldmeta.out
          cat kbldmeta.out | tail -n 1 | sed 's/.*final: kapp-controller -> \(.*\)$/\1/p'  | tail -n 1 | xargs kind load docker-image --name kinder
          kapp deploy -a kc -f kbld.out -c -y
          export KAPPCTRL_E2E_SECRETGEN_CONTROLLER=true
          source ./hack/secretgen-controller.sh
          deploy_secretgen-controller
          mkdir tmp
          KAPPCTRL_E2E_NAMESPACE=kappctrl-test eval './hack/test-e2e.sh'

  k8s-api-endpoints:
    name: TestK8APIEndpoints (all k8s versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install kind + kubectl
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.33.0
      - name: Install Carvel Tools
        run: ./hack/install-deps.sh
      - name: Resolve latest kindest/node patch per minor
        run: |
          set -e -x
          # Fixed compatibility range (major.minor); patch versions are resolved
          # to whatever kindest/node currently publishes as latest, so this list
          # doesn't need to be bumped by hand every time a new patch ships.
          minors=(v1.33 v1.34 v1.35 v1.36 v1.37)
          url="https://hub.docker.com/v2/repositories/kindest/node/tags?page_size=100"
          all_tags=""
          while [ -n "$url" ] && [ "$url" != "null" ]; do
            page=$(curl -sf "$url")
            all_tags="$all_tags
          $(echo "$page" | jq -r '.results[].name')"
            url=$(echo "$page" | jq -r '.next')
          done
          versions=()
          for m in "${minors[@]}"; do
            latest=$(echo "$all_tags" | grep -E "^${m}\.[0-9]+$" | sort -V | tail -1)
            if [ -z "$latest" ]; then
              echo "::error::No kindest/node tag found for $m"
              exit 1
            fi
            versions+=("$latest")
          done
          echo "Resolved versions: ${versions[*]}"
          {
            echo "K8S_VERSIONS<<EOF"
            printf '%s\n' "${versions[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"
      - name: Build kapp-controller image
        run: |
          set -e -x
          source ./hack/version-util.sh
          ytt -f config/config -f config/values-schema.yml -f config-dev -v dev.version="$(get_kappctrl_ver)+develop" | kbld -f- > kbld.out 2> kbldmeta.out
          echo "KC_IMAGE=$(cat kbldmeta.out | tail -n 1 | sed 's/.*final: kapp-controller -> \(.*\)$/\1/p' | tail -n 1)" >> "$GITHUB_ENV"
      - name: Run TestK8APIEndpoints across k8s versions
        run: |
          set -x
          mkdir -p tmp
          failed=()
          while IFS= read -r version; do
            [ -z "$version" ] && continue
            echo "::group::TestK8APIEndpoints (kindest/node:${version})"
            ok=true
            kind create cluster --name kinder --image "kindest/node:${version}" || ok=false
            if $ok; then kind load docker-image "$KC_IMAGE" --name kinder || ok=false; fi
            if $ok; then kapp deploy -a kc -f kbld.out -c -y || ok=false; fi
            if $ok; then
              KAPPCTRL_E2E_NAMESPACE=kappctrl-test ./hack/test-e2e.sh -run TestK8APIEndpoints || ok=false
            fi
            if $ok; then
              echo "TestK8APIEndpoints passed for kindest/node:${version}"
            else
              echo "::error::TestK8APIEndpoints FAILED for kindest/node:${version}"
              failed+=("$version")
            fi
            kind delete cluster --name kinder || true
            echo "::endgroup::"
          done <<< "$K8S_VERSIONS"
          if [ ${#failed[@]} -ne 0 ]; then
            echo "::error::TestK8APIEndpoints failed for k8s version(s): ${failed[*]}"
            exit 1
          fi